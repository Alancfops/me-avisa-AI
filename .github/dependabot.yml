# Uma PR por ecossistema, uma vez por mês, para não encher a lista de PRs.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      # Versão nova do Node é escolhida à mão, só entre as LTS (as pares).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
