<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C1F"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- contorno sutil para destacar em abas escuras -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <!-- barras / prédios -->
  <rect x="11" y="38" width="10" height="16" rx="2" fill="#FFFFFF" opacity="0.35"/>
  <rect x="27" y="29" width="10" height="25" rx="2" fill="#FFFFFF" opacity="0.65"/>
  <rect x="43" y="19" width="10" height="35" rx="2" fill="#FFFFFF"/>
  <!-- janelinhas do prédio maior -->
  <rect x="46" y="25" width="4" height="3" rx="1" fill="#1C1C1F"/>
  <rect x="46" y="32" width="4" height="3" rx="1" fill="#1C1C1F"/>
  <rect x="46" y="39" width="4" height="3" rx="1" fill="#1C1C1F"/>
  <!-- linha de tendência -->
  <polyline points="9,34 24,24 36,26 50,12" fill="none" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ponto de alerta -->
  <circle cx="53" cy="11" r="6" fill="#FBBF24" stroke="#050506" stroke-width="2"/>
</svg>
